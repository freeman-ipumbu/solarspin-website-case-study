<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">SolarSpin visual language</title>
  <desc id="desc">SolarSpin brand colours named Gravity, Orbit, Field, Pulse, Paper and Dune, with their roles.</desc>
  <rect width="1600" height="620" rx="34" fill="#f3eee6"/>
  <text x="74" y="92" fill="#071522" font-family="ui-monospace, monospace" font-size="15" font-weight="800" letter-spacing="4">THE VISUAL FIELD</text>
  <text x="74" y="155" fill="#071522" font-family="Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">Six materials. One universe.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(74 230)"><rect width="230" height="260" rx="28" fill="#071522"/><text x="24" y="198" fill="#f8fafc" font-size="25" font-weight="900">Gravity</text><text x="24" y="226" fill="#b7c2cf" font-size="14">Foundation</text></g>
    <g transform="translate(318 230)"><rect width="230" height="260" rx="28" fill="#5655e8"/><text x="24" y="198" fill="#f8fafc" font-size="25" font-weight="900">Orbit</text><text x="24" y="226" fill="#f8fafc" font-size="14" opacity=".8">Relationships</text></g>
    <g transform="translate(562 230)"><rect width="230" height="260" rx="28" fill="#28c7ad"/><text x="24" y="198" fill="#071522" font-size="25" font-weight="900">Field</text><text x="24" y="226" fill="#071522" font-size="14" opacity=".75">Evidence + action</text></g>
    <g transform="translate(806 230)"><rect width="230" height="260" rx="28" fill="#ff4f7b"/><text x="24" y="198" fill="#071522" font-size="25" font-weight="900">Pulse</text><text x="24" y="226" fill="#071522" font-size="14" opacity=".75">Human energy</text></g>
    <g transform="translate(1050 230)"><rect width="230" height="260" rx="28" fill="#f8fafc" stroke="#d7dce5"/><text x="24" y="198" fill="#071522" font-size="25" font-weight="900">Paper</text><text x="24" y="226" fill="#3e4c5e" font-size="14">Clarity</text></g>
    <g transform="translate(1294 230)"><rect width="230" height="260" rx="28" fill="#f3eee6" stroke="#c9c1b5"/><text x="24" y="198" fill="#071522" font-size="25" font-weight="900">Dune</text><text x="24" y="226" fill="#3e4c5e" font-size="14">Origin + warmth</text></g>
  </g>
  <path d="M74 548H1524" stroke="#071522" stroke-opacity=".22"/>
  <text x="74" y="582" fill="#3e4c5e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">EDITORIAL SCALE  /  INSTRUMENT LABELS  /  ORBITAL GEOMETRY  /  HUMAN CORE</text>
</svg>
