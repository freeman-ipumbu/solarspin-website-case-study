    <g transform="translate(1110 104)"><rect width="300" height="92" rx="20" fill="#101f30" stroke="#304155"/><text x="24" y="33" fill="#8585ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">02 / THE SYSTEM</text><text x="24" y="65" fill="#f8fafc" font-size="21" font-weight="800">Connected company map</text></g>
    <g transform="translate(1210 314)"><rect width="300" height="92" rx="20" fill="#101f30" stroke="#304155"/><text x="24" y="33" fill="#ff5e88" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">03 / THE PROOF</text><text x="24" y="65" fill="#f8fafc" font-size="21" font-weight="800">Bounded project evidence</text></g>
    <g transform="translate(1050 530)"><rect width="300" height="92" rx="20" fill="#101f30" stroke="#304155"/><text x="24" y="33" fill="#36e1c3" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">04 / THE METHOD</text><text x="24" y="65" fill="#f8fafc" font-size="21" font-weight="800">Five inspectable stages</text></g>
    <g transform="translate(254 526)"><rect width="300" height="92" rx="20" fill="#101f30" stroke="#304155"/><text x="24" y="33" fill="#8585ff" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">05 / THE FOUNDER</text><text x="24" y="65" fill="#f8fafc" font-size="21" font-weight="800">Conviction + continuity</text></g>
