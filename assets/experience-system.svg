<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">SolarSpin website experience system</title>
  <desc id="desc">Six connected experience chapters orbit a central SolarSpin core: centre, system, proof, method, founder and invitation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#040b12"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#ff7799"/><stop offset="1" stop-color="#ff4f7b"/></radialGradient>
  </defs>
  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke-width="2">
