    <ellipse cx="800" cy="360" rx="392" ry="290" stroke="#36e1c3" stroke-opacity=".25" stroke-dasharray="8 12"/>
    <ellipse cx="800" cy="360" rx="255" ry="145" stroke="#b7c2cf" stroke-opacity=".18"/>
  </g>
  <circle cx="800" cy="360" r="89" fill="#ff4f7b" opacity=".12"/>
